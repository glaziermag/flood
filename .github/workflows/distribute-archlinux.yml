name: Distribute for Arch Linux

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish Packages']
    types:
      - completed

# REPRO ONLY: lines 1-8 byte-identical to upstream distribute-archlinux.yml; AUR push replaced by echo.
jobs:
  aur:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "upstream workflow=${{ github.event.workflow_run.name }} id=${{ github.event.workflow_run.id }}"
